name: Release

on:
  push:
    tags:
      - 'v*'

# Empty at workflow level (F-164): the one job below asks for what it writes, so a
# job added later cannot inherit it.
permissions: {}

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    # Measured on the last 10 runs (30 May to 1 Nov 2026): longest 73 s, so 3
    # minutes is 2.5 times. Those runs had the Go cache that `cache: false` below
    # takes away, so the first run at a tag measures the cold duration: tune this
    # line then, with that number in hand.
    timeout-minutes: 3
    permissions:
      contents: write # creates the draft release and uploads its archives (.goreleaser.yml: release.github, draft: true); nothing else is written
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # goreleaser needs full tag history
          # Nothing here pushes: .goreleaser.yml has release.github only (this
          # repository, through the API with the GITHUB_TOKEN of the environment) and no
          # tap, bucket or other repository to write to; the full history is
          # already local because of fetch-depth. So the credential has no reason
          # to stay in the workspace.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod   # same toolchain as the gate — the release binaries
                                    # must not be built by a Go the gate never ran
          # No cache: a job that runs a few times a year gains little from one, and a
          # cache restored in a workflow that publishes is a way in for a poisoned
          # entry (zizmor: cache-poisoning). The price is a cold build.
          cache: false
      # Same step as in ci.yml (the note is in the lint job). Here it is the one
      # that matters most: what this job builds is what users download.
      - name: The Go that runs is the toolchain line of go.mod
        run: |
          want="$(awk '$1 == "toolchain" { print $2; exit }' go.mod | tr -d '\r')"
          got="$(go env GOVERSION | tr -d '\r')"
          if [ -z "${want}" ] || [ "${got}" != "${want}" ]; then
            echo "::error title=wrong Go toolchain::go.mod asks for '${want:-<no toolchain line>}', this job runs '${got}'"
            exit 1
          fi
          echo "Go ${got} is the toolchain line of go.mod"
      # THE TAG IS CHECKED HERE AND NOWHERE ELSE, because this is the only job
      # where a tag exists by construction: it runs on `push: tags`.
      #
      # Not in ci.yml, and not from `git describe`. That checkout is shallow and
      # carries no tags at all — and the Makefile's line (`--always`, stderr
      # discarded) does NOT fail without them: it returns a bare SHA that looks
      # like a good value. A guard built on it would be red on every run, or be
      # made conditional, and a conditional tag check is the silent green.
      #
      # Before goreleaser rather than after: the point is to not publish a
      # release whose plugin manifest names a different version than the binary
      # shipped beside it, which is how the last one went out.
      #
      # EVERY LINE OF THIS FILE IS UNDER CONTRACT, not just this step. Six ways
      # of disarming the guard were found and five of them leave a step that
      # still reads correctly: commenting the env out, moving it onto a later
      # step, adding continue-on-error, reordering past goreleaser, or wrapping
      # the command so it cannot fail. None is visible to an assertion that
      # looks for a step by name, and all are visible to an exact comparison of
      # the whole file.
      #
      # AND IT ASKS FOR THE VERDICT, NOT THE EXIT CODE. `go test -run` on a name
      # that selects nothing prints "ok … [no tests to run]" and exits 0, so an
      # exit code cannot tell "the guard passed" from "the guard never ran" —
      # and anything that removes the guard from the binary (a build tag, a
      # renamed file) produces exactly the second while looking like the first.
      # The grep is the line that separates them. The log goes to mktemp rather
      # than into the checkout because goreleaser refuses a dirty tree, and a
      # guard that breaks the release it is guarding would get deleted.
      - name: the tag must match the plugin manifest
        env:
          CAB_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          log="$(mktemp)"
          go test -run '^TestVersionDrift_TagMatchesSource$' -count=1 -v ./tests/integration/ > "$log" 2>&1 || { cat "$log"; exit 1; }
          grep -q '^--- PASS: TestVersionDrift_TagMatchesSource' "$log" || { echo "the tag guard was NOT executed"; cat "$log"; exit 1; }

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # PINNED, not a range, and this is a correction rather than a
          # precaution: .goreleaser.yml already uses `formats:` and
          # `format_overrides[].formats`, which are the >= 2.6 spelling. A
          # moving `~> v2` could therefore have broken a release on a day
          # nobody touched the repository — the same shape as
          # `go-version: stable`, which did exactly that to the gate on 11
          # August.
          version: 'v2.18.1'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
