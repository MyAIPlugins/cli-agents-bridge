name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No token permission at workflow level (F-164): every job below asks for what
# it uses. A job added later without a `permissions:` block gets nothing, not the
# repository default.
permissions: {}

# TIMEOUTS (F-164). The default is 360 minutes, so a hung job would hold a runner
# for six hours before anyone saw it. Each job below has 2-3 times the longest
# duration measured over the last 10 completed runs of this workflow (10-11
# November 2026, `gh run view`, job wall time): lint 99 s -> 4 min, test on ubuntu
# 150 s -> 6 min, test on windows 222 s -> 10 min, cross-compile 40 s -> 2 min (a
# minute is the smallest unit: 1 would be 1.5 times). Measure again when a job gets
# slower. A kill is loud ("exceeded the maximum execution time"), never a green.
#
# EXCEPT the macOS leg of the test job (F-163), which has no measurement yet: its
# 10 minutes are PROVISIONAL, the same as the slowest leg known, written so that
# the first runs are not killed for a number nobody measured. They are replaced by
# 2-3 times the longest of its first five runs (BAR F-163, criterion 5).

jobs:
  # LINT RUNS ONCE AND READS EVERY PLATFORM — which until this change it did not.
  #
  # `go vet` and staticcheck only ever see the files the build constraints let
  # through, so a lint pinned to ubuntu had never analysed a single `_windows.go`
  # or `_darwin.go` file in this repository. Not "analysed them less": never
  # opened them, since the day those files were written.
  #
  # Proved rather than assumed, with the critic's method — change the source and
  # see what stays behind — because "the linter probably covers it" is exactly
  # the kind of sentence that survives for months. An unused function planted in
  # internal/session/alive_windows.go is invisible to GOOS=linux and comes back
  # as U1000 under GOOS=windows.
  #
  # And it needs no second runner: static analysis executes nothing, so one Linux
  # machine reads all three platforms. Measured on the Windows PC: vet under a
  # second per GOOS, staticcheck ~1.8s warm. Five seconds closes a hole that has
  # been open from the start.
  #
  # Only `go test` needs the real operating system, and that is the ONLY thing
  # the matrix below runs.
  lint:
    name: Lint (vet + staticcheck, every GOOS)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in this job pushes
      - name: Set up Go (the toolchain line of go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # `go-version-file: go.mod`, NOT `go-version: stable`, and this is the
          # line that broke the gate on 11 August without anybody touching the
          # repository. `stable` moves: it became Go 1.27, the pinned staticcheck
          # could not read its export data, and the job that authorises merges
          # went red on its own while every local gate stayed green. A version
          # that changes underneath you turns somebody's unrelated PR red for
          # something they did not write.
          #
          # Now the number lives in go.mod's `toolchain` line — one source for
          # this workflow, the release workflow, the Mac, WSL2 and the Windows
          # PC. The `go` line above it stays the LANGUAGE minimum: what the
          # module needs to compile, not what builds it.
          #
          # setup-go reads the `toolchain` line first (the `go` line only when
          # there is none), installs exactly that Go, and sets GOTOOLCHAIN=local
          # for every later step. So `go` never switches to another toolchain and
          # no job downloads one. The previous pin (v5) read only the `go` line,
          # installed that older Go, and left GOTOOLCHAIN=auto to fetch the real
          # one from the network in EVERY job: eight downloads a run, one of
          # which failed on 9 November and turned a PR red for a reason nobody
          # had written. The action itself logs `go version` right after
          # installing, so the proof is in the log of every job, those that print
          # nothing of their own included.
          #
          # One limit, read in the action's source and not tested here: the
          # `toolchain` line is honoured only while GOTOOLCHAIN is not already
          # `local` when the action starts; otherwise it falls back to the `go`
          # line. Safe in this file, where each job calls setup-go once on a
          # runner that starts without it. A second setup-go in the same job
          # would silently install the language minimum.
          go-version-file: go.mod
          cache: true
      # The Go that RUNS must be the one go.mod names (F-164). setup-go honours
      # the `toolchain` line only while GOTOOLCHAIN is not already `local` when it
      # starts; otherwise it installs the `go` line, the language minimum, and says
      # nothing: the job stays green on a compiler the gate never ran (F-162,
      # finding 2). This step compares the two and fails showing both. A missing
      # `toolchain` line fails too (AllOrNothing, as in `make lint`), and `tr`
      # strips the CR a Windows checkout may leave in go.mod. There are four copies,
      # one after each setup-go (here, test, cross-compile, release.yml): a test
      # keeps them identical and requires one right after every setup-go.
      - name: The Go that runs is the toolchain line of go.mod
        run: |
          want="$(awk '$1 == "toolchain" { print $2; exit }' go.mod | tr -d '\r')"
          got="$(go env GOVERSION | tr -d '\r')"
          if [ -z "${want}" ] || [ "${got}" != "${want}" ]; then
            echo "::error title=wrong Go toolchain::go.mod asks for '${want:-<no toolchain line>}', this job runs '${got}'"
            exit 1
          fi
          echo "Go ${got} is the toolchain line of go.mod"
      - name: go vet (every GOOS)
        run: |
          go version
          for goos in linux windows darwin; do
            echo "== go vet GOOS=${goos} =="
            GOOS="${goos}" go vet ./...
          done
      - name: staticcheck (every GOOS)
        # PINNED, and the pin lives in .staticcheck-version — the ONE place, read
        # by this job and by `make lint`. Not @latest: a lint that moves under
        # you turns an unrelated PR red for something its author did not write.
        #
        # No version literal in this comment either. An earlier draft named the
        # number here "for the reader", and that is a second source: changing the
        # file left this line stating the old one, with the test still green.
        run: |
          # Version from .staticcheck-version, the same file the Makefile reads,
          # so the local gate and this one cannot drift onto two linters.
          # GOBIN when set, GOPATH/bin otherwise — the same resolution `go
          # install` uses (CRI: the Makefile knew only GOPATH/bin).
          version="$(cat .staticcheck-version)"
          go install "honnef.co/go/tools/cmd/staticcheck@${version}"
          bindir="$(go env GOBIN)"; [ -n "$bindir" ] || bindir="$(go env GOPATH)/bin"
          for goos in linux windows darwin; do
            echo "== staticcheck GOOS=${goos} =="
            GOOS="${goos}" "${bindir}/staticcheck" ./...
          done

  # THE GATE THAT AUTHORISES MERGES, and until this change it could only speak
  # for Linux — while the port it was guarding was a Windows one.
  #
  # `fail-fast: false` is not a detail here. The whole reason for a matrix is to
  # learn WHICH platform is red; cancelling the siblings on the first failure
  # buys a few seconds and throws away the answer.
  #
  # `-count=1` is load-bearing and not optional (LL-11, learned twice): without
  # it Go serves untouched packages from cache, so a change to a SHARED struct or
  # helper never re-runs the tests of the packages that use it. `cache: true`
  # above restores Go's build cache BETWEEN RUNS, which is exactly the condition
  # the flag exists for. Note which cache is which: the build cache is welcome
  # and per-runner, the TEST RESULT cache is the one that lies, and `-count=1`
  # is what disables it. Nothing in this matrix may put the test step behind a
  # per-OS condition — a leg that silently skips is how a matrix goes green
  # without running anything.
  #
  # The toolchain step PRINTS instead of assuming. Whether the race detector has
  # a C compiler on a given runner image is the kind of fact that is documented
  # somewhere and true elsewhere; the only version of it worth having is the one
  # this job printed on the day it ran. Same for `make`, whose absence makes
  # makefile_lint_test SKIP rather than fail — a silent skip being the worst
  # sort of green.
  #
  # macOS joins for the reason Windows did (F-163): a platform nobody runs is a
  # platform nobody tests. The tests that need a volume which does not tell upper
  # from lower case apart (F-157, F-142) used to run only on the maintainer's Mac,
  # so nobody else saw them fail and nothing but one person's gate kept them
  # alive. It counts like the other two legs: same steps, same `fail-fast: false`.
  # The last step of the job shows those tests by name and fails if one of them
  # skipped on a volume where it applies.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The timeout travels with the OS it was measured on, see `include` below.
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            timeout: 6
          - os: windows-latest # the slow leg: 222 s against 150 s on ubuntu
            timeout: 10
          - os: macos-latest
            timeout: 10 # PROVISIONAL, not measured yet: see TIMEOUTS at the top
    defaults:
      run:
        # bash on every runner, Git Bash on Windows: one shell means the steps
        # below cannot mean two different things depending on the leg.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in this job pushes
      - name: Set up Go (the toolchain line of go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Same step as in lint, see the note there.
      - name: The Go that runs is the toolchain line of go.mod
        run: |
          want="$(awk '$1 == "toolchain" { print $2; exit }' go.mod | tr -d '\r')"
          got="$(go env GOVERSION | tr -d '\r')"
          if [ -z "${want}" ] || [ "${got}" != "${want}" ]; then
            echo "::error title=wrong Go toolchain::go.mod asks for '${want:-<no toolchain line>}', this job runs '${got}'"
            exit 1
          fi
          echo "Go ${got} is the toolchain line of go.mod"
      - name: toolchain report
        run: |
          go version
          go env GOOS GOARCH CC CGO_ENABLED
          gcc --version || echo "no gcc on this runner"
          clang --version || echo "no clang on this runner"
          make --version || echo "no make on this runner — makefile tests will SKIP"
      - name: go test -race -count=1
        run: go test -race -count=1 ./...
      # The tests that exist for a volume that does not tell upper from lower case
      # apart, run again BY NAME so the log shows each of them and whether it ran.
      # A skip is how such a test quietly stops existing: its own Go probe decides
      # "this volume keeps the two spellings distinct" and the leg stays green having
      # proved nothing. So the volume is probed here too, in shell and apart from
      # the Go probe, and a test that skipped where its property holds fails the
      # step. Linux is expected to skip them (printed, not hidden); macOS is the leg
      # that must show them as PASS. There is no condition on the OS anywhere in
      # this step: the probes decide, a leg does not get to opt out. Written for bash
      # 3.2, the one macOS ships.
      - name: The volume, and the tests that depend on it
        run: |
          # An explicit template in the directory Go writes its test files to
          # (os.TempDir: $TMPDIR, else /tmp, on Unix). A bare `mktemp -d` on macOS
          # does not follow TMPDIR, and then this would probe a different volume from
          # the one the tests use: a true answer about the wrong place. On Windows Go
          # reads TMP, TEMP, USERPROFILE instead, and the /tmp here is Git Bash's: a
          # different directory on the same NTFS, so the probe agrees with the tests
          # there by luck, not by construction.
          dir="$(mktemp -d "${TMPDIR:-/tmp}/volume-probe.XXXXXX")"
          touch "${dir}/CaseProbe" "${dir}/$(printf 'caf\303\251')"
          ignores_case=no; [ -e "${dir}/caseprobe" ] && ignores_case=yes
          one_unicode_name=no; [ -e "${dir}/$(printf 'cafe\314\201')" ] && one_unicode_name=yes
          real="$(cd "${dir}" && pwd -P)"
          has_firmlink=no; [ "${real}" -ef "/System/Volumes/Data${real}" ] && has_firmlink=yes
          rm -r "${dir}"
          echo "temp dir:                                      ${TMPDIR:-/tmp}"
          echo "CaseProbe and caseprobe are one name:          ${ignores_case}"
          echo "NFC and NFD spellings of cafe are one name:    ${one_unicode_name}"
          echo "the temp dir is also reached through /System/Volumes/Data (firmlink): ${has_firmlink}"

          log="$(mktemp)"
          go test -race -count=1 -v \
            -run '^(TestFindProjectRoot_HomeUnderAnotherSpelling_CaseAndUnicode|TestFindProjectRoot_HomeUnderAnotherSpelling_Firmlink|TestMakefile_SkillsOldCopyMessagesAreSafeToFollow)$' \
            ./internal/session ./tests/integration > "${log}" 2>&1 || { cat "${log}"; exit 1; }
          grep -E '^ *--- (PASS|SKIP|FAIL):.*(CaseAndUnicode|Firmlink|spelled_with_other_cases|SafeToFollow \()' "${log}" \
            || { echo "::error title=no volume test in the log::the -run pattern selected none of them (a rename?)"; cat "${log}"; exit 1; }

          # property, what it is, the test that must show PASS when it holds, and the
          # pattern of every test that must not SKIP when it holds. The Makefile test
          # is in the case pattern by its PARENT name too: without `make` it skips at
          # the top, with a line that has no `spelled_with_other_cases` in it, and its
          # two volume subtests would vanish without a trace.
          check() {
            [ "$1" = yes ] || return 0
            if ! grep -q -E "^ *--- PASS:.*$3" "${log}"; then
              echo "::error title=a volume test did not run::$2 holds here, and ${3} has no PASS line"
              exit 1
            fi
            if grep -q -E "^ *--- SKIP:.*($4)" "${log}"; then
              echo "::error title=a volume test was skipped where it applies::$2 holds here, and a test that needs it skipped"
              exit 1
            fi
          }
          check "${ignores_case}" "a volume that ignores case" 'CaseAndUnicode/case' 'CaseAndUnicode/case|spelled_with_other_cases|SkillsOldCopyMessagesAreSafeToFollow'
          check "${one_unicode_name}" "a volume with one name for NFC and NFD" 'CaseAndUnicode/unicode' 'CaseAndUnicode/unicode'
          check "${has_firmlink}" "a firmlink to the data volume" 'Firmlink' 'Firmlink'
          echo "no volume test skipped where its property holds"

  # Windows joins the matrix because we are about to support it, and a platform
  # nobody compiles is a platform nobody supports.
  #
  # windows/arm64 is deliberately ABSENT, and absent is not the same as
  # forgotten: Go builds it and the build would cost the same seconds, but
  # nobody on this project owns a Windows-on-ARM machine, so it would be an
  # artifact that never runs anywhere. We would rather ship one fewer binary
  # than one nobody has ever started.
  #
  # WHAT THIS MIRRORS, and it is true again: `Makefile: cross-compile-all` and
  # `.goreleaser.yml` now build the same five combinations, windows/amd64
  # included.
  #
  # It was not true for a while, and the note is kept rather than deleted
  # because the gap is the interesting part: this job shipped first and the
  # release followed, so for a few hours CI verified a platform the release did
  # not carry — a Windows user could watch the build go green and still have
  # nothing to download. Written down at the time instead of left for somebody
  # to discover, and closed here.
  cross-compile:
    name: Cross-compile (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in this job pushes
      - name: Set up Go (the toolchain line of go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Same step as in lint, see the note there. Here it matters most: this job
      # builds the binaries a user could download.
      - name: The Go that runs is the toolchain line of go.mod
        run: |
          want="$(awk '$1 == "toolchain" { print $2; exit }' go.mod | tr -d '\r')"
          got="$(go env GOVERSION | tr -d '\r')"
          if [ -z "${want}" ] || [ "${got}" != "${want}" ]; then
            echo "::error title=wrong Go toolchain::go.mod asks for '${want:-<no toolchain line>}', this job runs '${got}'"
            exit 1
          fi
          echo "Go ${got} is the toolchain line of go.mod"
      - name: Build static binary (CGO_ENABLED=0)
        # The matrix values reach the script through the environment, never
        # through `${{ }}` inside it: an expression is pasted into the script text
        # before bash sees it (zizmor: template-injection). These come from the
        # static list above, so today it is harmless, but a build line that stays
        # safe when somebody adds a matrix entry from elsewhere costs nothing.
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" \
            -o "bin/cab-bridge-${GOOS}-${GOARCH}${EXT}" \
            ./cmd/cab-bridge
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cab-bridge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/cab-bridge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          # `error`, not the default `warn`: the build line above derives the file
          # name from the environment and this path from the matrix, and two names
          # that stopped agreeing would otherwise upload nothing and stay green.
          if-no-files-found: error
          retention-days: 30
