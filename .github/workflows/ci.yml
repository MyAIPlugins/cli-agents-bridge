name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # THE GATE THAT AUTHORISES MERGES, and until now it was the weaker of the two.
  #
  # The Makefile carries seven lines explaining why `-count=1` is not optional
  # (LL-11, learned twice): without it Go serves untouched packages from cache,
  # so a change to a SHARED struct or helper never re-runs the tests of the
  # packages that use it. This job ran without it — with `cache: true` restoring
  # Go's build/test cache BETWEEN RUNS, which is exactly the condition the flag
  # exists for. The strict door was the one nobody used; the one that decides
  # merges was the loose one.
  #
  # And the job was called "lint + race" while running only `vet`: a name that
  # asserts more than it executes, which is the same class the code it guards
  # spent nine rounds closing. Fixed by making the execution match the name —
  # staticcheck now runs here too — rather than by renaming the job down.
  #
  # `go-version-file: go.mod`, NOT `go-version: stable`, and this is the line
  # that broke the gate on 11 August without anybody touching the repository.
  # `stable` moves: it became Go 1.27, the pinned staticcheck could not read its
  # export data, and the job that authorises merges went red on its own while
  # every local gate stayed green. A version that changes underneath you turns
  # somebody's unrelated PR red for something they did not write.
  #
  # Now the number lives in go.mod's `toolchain` line — one source for this job,
  # the release workflow, the Mac, WSL2 and the Windows PC. `go 1.25.0` above it
  # stays the LANGUAGE minimum: what the module needs to compile, not what builds
  # it. When setup-go honours only the `go` line, GOTOOLCHAIN=auto downloads the
  # toolchain anyway — either way the `go version` printed by this job is the
  # proof, which is why it is worth reading.
  test:
    name: Test (vet + staticcheck + race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        # PINNED, and the pin lives in .staticcheck-version — the ONE place, read
        # by this job and by `make lint`. Not @latest: a lint that moves under
        # you turns an unrelated PR red for something its author did not write.
        #
        # No version literal in this comment either. An earlier draft named the
        # number here "for the reader", and that is a second source: changing the
        # file left this line stating the old one, with the test still green.
        run: |
          # Version from .staticcheck-version, the same file the Makefile reads,
          # so the local gate and this one cannot drift onto two linters.
          # GOBIN when set, GOPATH/bin otherwise — the same resolution `go
          # install` uses (CRI: the Makefile knew only GOPATH/bin).
          version="$(cat .staticcheck-version)"
          go install "honnef.co/go/tools/cmd/staticcheck@${version}"
          bindir="$(go env GOBIN)"; [ -n "$bindir" ] || bindir="$(go env GOPATH)/bin"
          "${bindir}/staticcheck" ./...
      - name: go test -race -count=1
        # -count=1 is load-bearing: see the note above the job.
        run: go test -race -count=1 ./...

  cross-compile:
    name: Cross-compile (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build static binary (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" \
            -o bin/cab-bridge-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/cab-bridge
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cab-bridge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/cab-bridge-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 30
