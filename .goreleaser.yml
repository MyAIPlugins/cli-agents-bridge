# GoReleaser config (v2) — prebuilt multi-OS binaries for GitHub Releases.
#
# Local gate (no install): builds dist/ without publishing —
#   go run github.com/goreleaser/goreleaser/v2@v2.18.1 release --snapshot --clean
# Validate config:
#   go run github.com/goreleaser/goreleaser/v2@v2.18.1 check
#
# THE SAME VERSION release.yml PUBLISHES WITH, and these two lines said @latest
# until somebody noticed: a maintainer following the instructions would have
# verified with one version and published with another, which is the very defect
# the pin was added to close — surviving in the text beside the corrected code.
# When a pinned value changes, the place to look next is everywhere else it is
# written.
#
# Matrix darwin/linux x amd64/arm64 PLUS windows/amd64, mirroring Makefile
# cross-compile-all and .github/workflows/ci.yml (CGO_ENABLED=0, -trimpath).
# Version is injected from the git tag into main.version (single source of truth
# = the tag).
#
# Windows is here because the port landed and a platform whose binary nobody can
# download is a platform that shipped to nobody: until this line, a Windows user
# had to build from source while CI verified the build for them.
#
# THE VERSION OF GORELEASER IS PINNED IN release.yml, and that matters to this
# file: `formats:` and `format_overrides[].formats` are the >= 2.6 spelling, so a
# moving version range would break the release on a day nobody touched anything.
version: 2
project_name: cab-bridge

builds:
  - id: cab-bridge
    main: ./cmd/cab-bridge
    binary: cab-bridge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # THE MATRIX IS CARTESIAN, so adding windows to goos adds windows/arm64 too.
    #
    # It is excluded here rather than by dropping arm64, which would also throw
    # away darwin/arm64 and linux/arm64 — the two we already ship, one of them to
    # the machine this project is developed on. The exclusion has to name the
    # single combination it means.
    #
    # And the reason it is excluded is not that it would fail to build: Go builds
    # it happily. It is that NOBODY HERE HAS A WINDOWS-ON-ARM MACHINE, so it
    # would be a published artifact that has never been started by anyone. One
    # fewer binary beats one nobody has run.
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: cab-bridge
    formats:
      - tar.gz
    # zip for Windows, tar.gz untouched everywhere else.
    #
    # The reason is compatibility and the path we document, NOT an inability:
    # `Expand-Archive` is built into PowerShell and takes zip, which is what the
    # README tells a Windows user to run, and zip is the format Windows tooling
    # has handled for the longest — including machines older than whatever is
    # current.
    #
    # It is emphatically NOT "Windows cannot open a tar.gz", which is what an
    # earlier version of this comment said and is false: Windows 11 24H2 handles
    # tar. A right decision resting on a wrong reason is a decision somebody
    # reverses the day they check the reason.
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "cab-bridge_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: myAIPlugins
    name: cli-agents-bridge
  # DRAFT, so that pushing a tag PREPARES a release instead of publishing one.
  #
  # The artifacts are still built by CI from the tag; what changes is that they
  # land in a draft — visible to people with write access, not downloadable by
  # anybody else — and going public becomes a deliberate human act rather than a
  # side effect of `git push --tags`.
  #
  # WHAT THIS DOES NOT DO, and it matters more than what it does: it VERIFIES
  # NOTHING. The release workflow still does not check that the tagged commit
  # ever passed CI, so a tag on an unverified tree still produces artifacts —
  # they just sit in a draft instead of on the internet. This line moves the
  # decision onto a person; it does not put a gate in front of it. Read as "the
  # gate is here" it would be worse than nothing, because it would stop somebody
  # from building the gate.
  draft: true
  prerelease: auto

changelog:
  disable: true
